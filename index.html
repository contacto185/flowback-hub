/* ── File upload helpers (Supabase Storage) ── */
function _chooseAdminFile(btn) {
  let opts;
  try { opts = JSON.parse(btn.getAttribute('data-fileopts') || '{}'); }
  catch { opts = {}; }
  const input = document.createElement('input');
  input.type = 'file';
  if (opts.accept) input.accept = opts.accept;
  input.onchange = async () => {
    const file = input.files?.[0];
    if (!file) return;
    await _uploadAdminFile(opts, file);
  };
  input.click();
}

function _clearAdminUpload(key) {
  const hidden = document.getElementById('af_' + key);
  const widget = document.getElementById('af_' + key + '_widget');
  const fields = ADMIN_FORMS[_adminEditType]?.fields || [];
  const f = fields.find(x => x.key === key);
  if (hidden) hidden.value = '';
  if (widget && f) {
    widget.innerHTML = _renderFileWidget(f, '');
    lucide.createIcons();
  }
}

async function _uploadAdminFile(opts, file) {
  const { key, bucket, pathPrefix, storeMode } = opts;
  const progEl  = document.getElementById('af_' + key + '_progress');
  const bar     = progEl?.querySelector('.af-progress-bar');
  const labelEl = progEl?.querySelector('.af-progress-label');
  const widget  = document.getElementById('af_' + key + '_widget');
  const hidden  = document.getElementById('af_' + key);

  // Path: lessons/{course_id}/{timestamp}-{filename}  (course-materials)
  // or    lessons/{timestamp}-{filename}              (thumbnails)
  const safeName  = file.name.replace(/[^\w.\-]+/g, '_');
  const courseId  = _adminLessonsCourseId || 'general';
  const ts        = Date.now();
  const path = bucket === 'course-materials'
    ? `${pathPrefix}/${courseId}/${ts}-${safeName}`
    : `${pathPrefix}/${ts}-${safeName}`;

  console.log('[upload] iniciando', file.name, file.size, 'bytes', '→', bucket + '/' + path);

  // Auth sanity check: surfaces "MISSING" when the client never picked up the session
  const { data: { session } } = await sb.auth.getSession();
  console.log('[upload] session:', session?.user?.email, 'token:', session?.access_token ? 'present' : 'MISSING');
  if (!session?.access_token) {
    alert('No hay sesión autenticada. Cerrá sesión y volvé a entrar.');
    return;
  }

  // Show progress UI, hide upload button
  if (widget) widget.style.display = 'none';
  if (progEl) progEl.classList.remove('hidden');
  if (bar) bar.style.width = '0%';
  if (labelEl) labelEl.textContent = `Subiendo ${safeName}…`;

  let data = null, error = null;
  try {
    data = await _uploadToBucketWithProgress(bucket, path, file, pct => {
      if (bar) bar.style.width = pct + '%';
      if (labelEl) labelEl.textContent = `Subiendo ${safeName}… ${pct}%`;
    });
  } catch (err) {
    error = err;
  }

  console.log('[upload] resultado', data, error);

  if (error) {
    console.error('[upload] error:', error);
    alert('Upload error: ' + JSON.stringify({
      message: error.message,
      status:  error.status,
      stack:   String(error.stack || '').split('\n')[0]
    }));
    if (progEl) progEl.classList.add('hidden');
    if (widget) widget.style.display = '';
    return;
  }

  // Resolve the value to store
  let stored;
  if (storeMode === 'publicUrl') {
    const { data: pub } = sb.storage.from(bucket).getPublicUrl(path);
    stored = pub?.publicUrl || path;
  } else {
    stored = path;
  }
  if (hidden) hidden.value = stored;

  // Refresh widget into "filled" state
  if (widget) {
    const fields = ADMIN_FORMS[_adminEditType]?.fields || [];
    const f = fields.find(x => x.key === key);
    widget.innerHTML = _renderFileWidget(f, stored);
    widget.style.display = '';
    lucide.createIcons();
  }
  if (progEl) progEl.classList.add('hidden');
}

function _uploadToBucketWithProgress(bucket, path, file, onProgress) {
  return new Promise(async (resolve, reject) => {
    try {
      const { data: { session } } = await sb.auth.getSession();
      const token = session?.access_token || SUPABASE_KEY;
      const url   = `${SUPABASE_URL}/storage/v1/object/${bucket}/${encodeURI(path)}`;
      console.log('[upload] POST', url, 'authToken:', token ? token.slice(0,12) + '…' : '(none)');
      const xhr   = new XMLHttpRequest();
      xhr.timeout = 90_000; // 90s — surface hangs as errors
      xhr.upload.onprogress = e => {
        if (e.lengthComputable && onProgress) {
          onProgress(Math.round(e.loaded / e.total * 100));
        }
      };
      xhr.onload = () => {
        console.log('[upload] xhr.onload status', xhr.status, 'body:', xhr.responseText?.slice(0, 200));
        if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.responseText);
        else reject(Object.assign(new Error(`HTTP ${xhr.status}: ${xhr.responseText}`), { status: xhr.status }));
      };
      xhr.onerror   = () => { console.error('[upload] xhr.onerror'); reject(new Error('Network error (CORS o conexión)')); };
      xhr.ontimeout = () => { console.error('[upload] xhr.ontimeout'); reject(new Error('Timeout 90s — el servidor no respondió')); };
      xhr.onabort   = () => { console.warn('[upload] xhr.onabort'); reject(new Error('Upload cancelado')); };
      xhr.open('POST', url);
      xhr.setRequestHeader('Authorization', `Bearer ${token}`);
      xhr.setRequestHeader('apikey', SUPABASE_KEY);
      xhr.setRequestHeader('x-upsert', 'true');
      xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
      xhr.send(file);
    } catch (e) {
      console.error('[upload] setup error', e);
      reject(e);
    }
  });
}

function openAdminForm(type, item) {
  _adminEditType = type;
  _adminEditItem = item;

  const schema = ADMIN_FORMS[type];
  if (!schema) return;

  document.getElementById('admin-modal-title').textContent =
    (item ? 'Editar' : 'Agregar') + ' ' + schema.title;

  document.getElementById('admin-modal-body').innerHTML =
    renderAdminFormFields(schema.fields, item) +
    `<div id="admin-form-error" class="text-xs text-error mb-3" style="display:none"></div>
     <button id="admin-save-btn" onclick="saveAdminForm()"
       class="btn-grad w-full py-3 rounded-xl text-sm mb-3">
       ${item ? 'Guardar cambios' : 'Crear ' + schema.title}
     </button>`;

  const overlay = document.getElementById('admin-modal-overlay');
  const sheet   = document.getElementById('admin-modal-sheet');
  overlay.style.display = 'flex';
  document.body.style.overflow = 'hidden';
  sheet.classList.remove('animate');
  void sheet.offsetWidth;
  sheet.classList.add('animate');
  _updateAdminFormVisibility();
  lucide.createIcons();
}

function closeAdminModal() {
  document.getElementById('admin-modal-overlay').style.display = 'none';
  document.body.style.overflow = '';
  _adminEditType = null;
  _adminEditItem = null;
}

function renderAdminFormFields(fields, item) {
  return fields.map(f => {
    const val = item?.[f.key] ?? f.defaultValue ?? '';
    const showIfAttrs = f.showIf
      ? ` data-showif-key="${escHtml(Object.keys(f.showIf)[0])}" data-showif-vals="${escHtml(Object.values(f.showIf)[0].join(','))}"`
      : '';

    if (f.type === 'toggle') {
      const checked = item ? (item[f.key] !== false) : true;
      return `
      <div class="flex items-center justify-between py-3 border-b border-white/5"${showIfAttrs}>
        <label class="text-sm text-white/70">${f.label}</label>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="af_${f.key}" class="sr-only peer" ${checked ? 'checked' : ''}>
          <div class="w-10 h-5 rounded-full peer-checked:bg-orange-500 bg-white/10 peer-focus:outline-none transition-colors after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-5"></div>
        </label>
      </div>`;
    }

    if (f.type === 'select') {
      return `
      <div class="mb-3"${showIfAttrs}>
        <label class="text-xs text-white/40 mb-1.5 block">${f.label}${f.required ? ' *' : ''}</label>
        <select id="af_${f.key}" class="auth-input"${f.key === 'content_type' ? ' onchange="_updateAdminFormVisibility()"' : ''}>
          ${f.options.map(o => `<option value="${o}"${val === o ? ' selected' : ''}>${o}</option>`).join('')}
        </select>
      </div>`;
    }

    if (f.type === 'textarea') {
      return `
      <div class="mb-3"${showIfAttrs}>
        <label class="text-xs text-white/40 mb-1.5 block">${f.label}</label>
        <textarea id="af_${f.key}" rows="3" class="auth-input" style="resize:vertical;" placeholder="${f.placeholder || ''}">${escHtml(String(val))}</textarea>
      </div>`;
    }

    if (f.type === 'file') {
      return `
      <div class="mb-3"${showIfAttrs}>
        <label class="text-xs text-white/40 mb-1.5 block">${f.label}${f.required ? ' *' : ''}</label>
        <input type="hidden" id="af_${f.key}" value="${escHtml(String(val))}">
        <div id="af_${f.key}_widget">${_renderFileWidget(f, val)}</div>
        <div id="af_${f.key}_progress" class="hidden mt-2">
          <div class="h-1 rounded-full overflow-hidden" style="background:rgba(42,32,26,.1);">
            <div class="af-progress-bar h-full" style="width:0%;background:var(--grad);transition:width .2s;"></div>
          </div>
          <p class="text-xs text-white/40 mt-1"><span class="af-progress-label">Subiendo…</span></p>
        </div>
      </div>`;
    }

    return `
    <div class="mb-3"${showIfAttrs}>
      <label class="text-xs text-white/40 mb-1.5 block">${f.label}${f.required ? ' *' : ''}</label>
      <input type="${f.type}" id="af_${f.key}" class="auth-input"
        value="${escHtml(String(val))}" placeholder="${f.placeholder || ''}">
    </div>`;
  }).join('');
}

function _renderFileWidget(f, val) {
  if (val) {
    const filename = String(val).split('/').pop() || 'archivo';
    return `
      <div class="flex items-center gap-2 px-3 py-2.5 rounded-xl" style="background:rgba(42,32,26,.06);border:1px solid rgba(42,32,26,.12);">
        <i data-lucide="${f.icon || 'file'}" class="w-4 h-4 text-white/50 flex-shrink-0"></i>
        <span class="flex-1 min-w-0 text-xs text-white/70 truncate" title="${escHtml(String(val))}">${escHtml(filename)}</span>
        <button type="button" onclick="_clearAdminUpload('${f.key}')"
          class="p-1 rounded flex-shrink-0" style="background:rgba(239,68,68,.1);" title="Quitar">
          <i data-lucide="x" class="w-3.5 h-3.5 text-red-400/80"></i>
        </button>
      </div>`;
  }
  const optsAttr = escHtml(JSON.stringify({ key: f.key, bucket: f.bucket, accept: f.accept, pathPrefix: f.pathPrefix, storeMode: f.storeMode }));
  return `
    <button type="button" data-fileopts="${optsAttr}" onclick="_chooseAdminFile(this)"
      class="w-full px-3 py-2.5 rounded-xl text-xs flex items-center gap-2"
      style="background:rgba(42,32,26,.06);border:1px dashed rgba(42,32,26,.15);">
      <i data-lucide="${f.icon || 'upload'}" class="w-4 h-4 text-white/40"></i>
      <span class="text-white/50">Subir archivo${f.accept ? ' (' + f.accept + ')' : ''}</span>
    </button>`;
}

function _updateAdminFormVisibility() {
  const body = document.getElementById('admin-modal-body');
  if (!body) return;
  body.querySelectorAll('[data-showif-key]').forEach(el => {
    const key  = el.getAttribute('data-showif-key');
    const vals = (el.getAttribute('data-showif-vals') || '').split(',');
    const ctrl = document.getElementById('af_' + key);
    if (!ctrl) return;
    el.style.display = vals.includes(ctrl.value) ? '' : 'none';
  });
}

async function saveAdminForm() {
  const schema = ADMIN_FORMS[_adminEditType];
  if (!schema) return;

  const errEl = document.getElementById('admin-form-error');
  const btn   = document.getElementById('admin-save-btn');

  // Collect values
  const payload = {};
  for (const f of schema.fields) {
    const el = document.getElementById('af_' + f.key);
    if (!el) continue;
    if (f.type === 'toggle')  payload[f.key] = el.checked;
    else if (f.type === 'number') payload[f.key] = el.value !== '' ? Number(el.value) : null;
    else payload[f.key] = el.value.trim() || null;

    if (f.required && !payload[f.key]) {
      errEl.textContent = `El campo "${f.label}" es obligatorio`;
      errEl.style.display = 'block'; return;
    }
  }
  errEl.style.display = 'none';

  // For new lessons, inject course_id from current lessons context
  if (_adminEditType === 'leccion' && !_adminEditItem?.id) {
    payload.course_id = _adminLessonsCourseId;
  }

  // Type coercion for courses: Supabase column types are strict
  if (_adminEditType === 'curso') {
    payload.price          = payload.price          != null && !isNaN(parseFloat(payload.price))          ? parseFloat(payload.price)          : null;
    payload.duration_hours = payload.duration_hours != null && !isNaN(parseFloat(payload.duration_hours)) ? parseFloat(payload.duration_hours) : null;
    payload.order_index    = parseInt(payload.order_index, 10) || 0;
    payload.currency       = String(payload.currency || 'CLP').substring(0, 3);
    payload.is_active      = Boolean(payload.is_active);
  }

  console.log('[saveAdminForm] payload:', payload);

  setLoading(btn, true);
  let data, error;
  if (_adminEditItem?.id) {
    ({ data, error } = await sb.from(schema.table).update(payload).eq('id', _adminEditItem.id).select());
  } else {
    ({ data, error } = await sb.from(schema.table).insert(payload).select());
  }
  setLoading(btn, false);

  console.log('[' + _adminEditType + ' insert] data:', data, 'error:', error);

  // Silent RLS rejection: no error but empty data means the policy blocked the write
  if (!error && (!data || data.length === 0)) {
    error = {
      message: 'No se guardó (posible bloqueo por RLS). Revisá las policies de la tabla ' + schema.table + '.',
      code: 'RLS_SILENT'
    };
  }

  if (error) {
    console.error('[saveAdminForm] error:', error, 'payload:', payload);
    alert('Error: ' + (error.message || 'desconocido') + ' | Code: ' + (error.code || 'n/a'));
    errEl.textContent = error.message || 'Error al guardar';
    errEl.style.display = 'block';
    return;
  }

  closeAdminModal();
  showToast(`${schema.title} ${_adminEditItem ? 'actualizado' : 'creado'} ✓`);
  if (_adminEditType === 'leccion') {
    loadAdminLecciones(_adminLessonsCourseId, _adminLessonsCourseTitle);
  } else {
    switchAdminTab(_adminCurrentTab);
  }
}

async function confirmDeleteAdmin(type, id) {
  const schema = ADMIN_FORMS[type];
  if (!schema) return;
  if (!confirm(`¿Eliminar este ${schema.title}? Esta acción no se puede deshacer.`)) return;

  const { error } = await sb.from(schema.table).delete().eq('id', id);
  if (error) showToast('Error al eliminar: ' + error.message, true);
  else {
    showToast(`${schema.title} eliminado`);
    if (type === 'leccion') {
      loadAdminLecciones(_adminLessonsCourseId, _adminLessonsCourseTitle);
    } else {
      switchAdminTab(_adminCurrentTab);
    }
  }
}

/* ═══════════════════════════════════════════
   APP INITIALIZATION
═══════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', async () => {
  // 1. Init Supabase
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: {
      persistSession:     true,
      autoRefreshToken:   true,
      detectSessionInUrl: true,
    }
  });

  // 2. Inject section shells into DOM
  injectSectionShells();

  // 2.1 Load admin-configured settings (hero/nutrición URLs) + plans + landing blocks in parallel
  await Promise.all([loadAppSettings(), loadPlans(), loadLandingBlocks()]);
  applyStoredImagesToDom();

  // 3. Set first active section (nav is rendered AFTER auth check to avoid flash)
  const el = document.getElementById('sec-inicio');
  if (el) el.classList.add('active');

  // 4. Render tribu section (logged-out form)
  renderTribuSection();

  // 5. Init Lucide icons
  lucide.createIcons();

  // 6. Check existing session BEFORE rendering nav — so we don't render the
  //    logged-out nav and then flip to the logged-in one (Admin tab flash bug).
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) {
    // handleSignedIn → updateUIForLoggedInUser → renderNavTabs (with correct state)
    await handleSignedIn(session.user);
  } else {
    renderNavTabs();
  }

  // 7. Listen for auth state changes (only SIGNED_IN/SIGNED_OUT trigger re-renders)
  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN')  await handleSignedIn(session.user);
    if (event === 'SIGNED_OUT') handleSignedOut();
    if (event === 'PASSWORD_RECOVERY') {
      showToast('Puedes cambiar tu contraseña ahora');
    }
  });

  // 9. Load initial public sections
  loadEventos();
  loadClasesGratis();
  loadCursos();

  // 10. Auto-show notification banner after 3s (first visit only)
  if (!localStorage.getItem('notif_dismissed')) {
    setTimeout(showNotifBar, 3000);
  }
});

/* ═══════════════════════════════════════════
   INICIO — intención selector
═══════════════════════════════════════════ */
function toggleIntencion(tipo) {
  const titulos = { ansiedad: '🌿 Calmar la ansiedad', tension: '💆 Soltar tensión', energia: '💪 Recuperar autoconfianza', presencia: '🧘 Estar presente' };
  const contenedor = document.getElementById('contenido-intencion');
  const titulo = document.getElementById('titulo-intencion');
  const btns = ['ansiedad','tension','energia','presencia'];
  const yaAbierto = !contenedor.classList.contains('hidden') && titulo.textContent === titulos[tipo];
  btns.forEach(b => document.getElementById('btn-'+b)?.classList.remove('ring-2','ring-accent-orange'));
  if (yaAbierto) { contenedor.classList.add('hidden'); return; }
  titulo.textContent = titulos[tipo];
  contenedor.classList.remove('hidden');
  document.getElementById('btn-'+tipo)?.classList.add('ring-2','ring-accent-orange');
  contenedor.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function cerrarIntencion() {
  document.getElementById('contenido-intencion')?.classList.add('hidden');
  ['ansiedad','tension','energia','presencia'].forEach(b => document.getElementById('btn-'+b)?.classList.remove('ring-2','ring-accent-orange'));
}
