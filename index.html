<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<meta name="description" content="Flowback Hub — Tu comunidad de transformación y bienestar">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Flowback Hub</title>

<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://www.paypal.com/sdk/js?client-id=AU_R4Y-BTzQILCsUM3iA3uw75DGehr-OrZHJksacC672RvNN2hSINpF2oUsFxwuhh6dEDPW9iZXpUaKz&currency=USD&intent=capture"></script>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        'bg-main': '#0B0E14',
        'bg-card': '#131820',
        'accent-orange': '#F57C00',
        'accent-blue': '#38BDF8',
      },
      fontFamily: {
        serif: ['"Playfair Display"', 'serif'],
        sans: ['Inter', 'sans-serif'],
      }
    }
  }
}
</script>

<style>
  :root {
    /* v3 light theme */
    --bg: #FFF8F0;
    --card: #FFFFFF;
    --card-bg: #FFFFFF;
    --text: #2A201A;
    --text-soft: rgba(42,32,26,.65);
    --text-muted: rgba(42,32,26,.45);
    --line: rgba(42,32,26,.08);
    --orange: #F57C00;
    --blue: #38BDF8;
    --grad: linear-gradient(135deg, #F57C00 0%, #38BDF8 100%);
    --cream: #FFF8F0;
    --accent-orange: #F57C00;
    --accent-warm: #FFB74D;
    --dark-bg: #0a0a0f;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(245,124,0,.3); border-radius: 3px; }

  /* Typography */
  .serif { font-family: 'Playfair Display', serif; }
  .grad-text {
    background: var(--grad);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Cards (v3 light) */
  .card {
    background: var(--card-bg);
    border-radius: 1rem;
    border: 1px solid var(--line);
    padding: 1rem;
    box-shadow: 0 1px 3px rgba(42,32,26,.05), 0 1px 2px rgba(42,32,26,.04);
    transition: border-color .2s, box-shadow .2s, transform .2s;
  }
  .card:hover {
    border-color: rgba(245,124,0,.3);
    box-shadow: 0 4px 12px rgba(42,32,26,.08), 0 2px 4px rgba(42,32,26,.05);
  }

  /* Buttons */
  .btn-grad {
    background: var(--grad);
    color: #fff;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn-grad:hover { transform: scale(1.02); box-shadow: 0 0 22px rgba(245,124,0,.35); }
  .btn-accent {
    background: var(--accent-orange);
    color: #fff;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s, background .2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn-accent:hover { transform: scale(1.02); box-shadow: 0 4px 18px rgba(245,124,0,.4); background: #FF8A1A; }
  .btn-paypal { background: #FFC439; color: #003087; font-weight: 700; cursor: pointer; transition: transform .2s, box-shadow .2s; }
  .btn-paypal:hover { transform: scale(1.02); box-shadow: 0 4px 16px rgba(255,196,57,.4); }
  .btn-ghost {
    background: rgba(42,32,26,.04);
    color: rgba(42,32,26,.7);
    border: 1px solid rgba(42,32,26,.08);
    cursor: pointer;
    transition: background .2s;
  }
  .btn-ghost:hover { background: rgba(42,32,26,.08); }

  /* Sections */
  .tab-section { display: none; }
  .tab-section.active { display: block; }

  /* Main layout */
  main { padding-top: 68px; padding-bottom: 120px; max-width: 480px; margin: 0 auto; }

  /* ── Bottom navigation ── */
  #bottom-nav {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 480px;
    background: rgba(255,255,248,.94);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(245,124,0,.2);
    border-radius: 24px;
    padding: 8px 4px;
    display: grid;
    grid-template-columns: repeat(var(--nav-cols, 5), 1fr);
    z-index: 50;
    gap: 2px;
    box-shadow: 0 8px 24px rgba(42,32,26,.08), 0 2px 8px rgba(42,32,26,.04);
  }

  .nav-tab {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 8px 2px;
    cursor: pointer;
    white-space: nowrap;
    border-radius: 16px;
    background: transparent;
    border: none;
    transition: background .2s;
    overflow: hidden;
  }
  .nav-icon-wrap {
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    transition: background .2s;
  }
  .nav-icon-wrap svg { color: rgba(42,32,26,.45); transition: color .2s; }
  .nav-label {
    font-size: 10px; font-weight: 500;
    color: rgba(42,32,26,.5);
    transition: color .2s;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Compact mode when many tabs (logged-in admin shows 8) */
  #bottom-nav[data-cols="7"] .nav-icon-wrap,
  #bottom-nav[data-cols="8"] .nav-icon-wrap { width: 30px; height: 30px; }
  #bottom-nav[data-cols="7"] .nav-label,
  #bottom-nav[data-cols="8"] .nav-label    { font-size: 9px; }
  .nav-tab.active .nav-icon-wrap { background: var(--accent-orange); }
  .nav-tab.active .nav-icon-wrap svg { color: #fff; }
  .nav-tab.active .nav-label { color: var(--accent-orange); font-weight: 600; }

  /* ── Badges ── */
  .badge-presencial { background: rgba(56,189,248,.14); color: #38BDF8; border: 1px solid rgba(56,189,248,.3); }
  .badge-online     { background: rgba(245,124,0,.14);  color: #F57C00; border: 1px solid rgba(245,124,0,.3); }
  .badge-gold       { background: linear-gradient(135deg,rgba(245,124,0,.2),rgba(255,193,7,.2)); color: #FFC107; border: 1px solid rgba(245,124,0,.4); }
  .badge-free       { background: rgba(34,197,94,.14); color: #22c55e; border: 1px solid rgba(34,197,94,.3); }
  .badge-basica     { background: rgba(56,189,248,.14); color: #38BDF8; border: 1px solid rgba(56,189,248,.3); }
  .badge-premium    { background: linear-gradient(135deg,rgba(245,124,0,.2),rgba(255,193,7,.2)); color: #FFC107; border: 1px solid rgba(245,124,0,.4); }
  .badge-vip        { background: linear-gradient(135deg,rgba(139,92,246,.2),rgba(245,124,0,.2)); color: #a78bfa; border: 1px solid rgba(139,92,246,.4); }

  /* ── Auth inputs ── */
  .auth-input {
    background: rgba(42,32,26,.04);
    border: 1px solid rgba(42,32,26,.1);
    color: var(--text);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14px;
    width: 100%;
    transition: border-color .2s;
    font-family: 'Inter', sans-serif;
  }
  .auth-input:focus { outline: none; border-color: var(--orange); background: #fff; }
  .auth-input::placeholder { color: rgba(42,32,26,.35); }
  .auth-input.error { border-color: #ef4444; }

  /* ── Inline auth tabs ── */
  .auth-tab-btn {
    flex: 1; padding: 8px; border-radius: 10px;
    font-size: 13px; font-weight: 500;
    color: rgba(42,32,26,.5);
    background: transparent; border: none; cursor: pointer;
    transition: background .2s, color .2s;
  }
  .auth-tab-btn.active {
    background: rgba(245,124,0,.15);
    color: var(--orange);
    font-weight: 600;
  }

  /* ── Sub-tabs (inside tribu) ── */
  .sub-tab-btn {
    flex: 1; padding: 8px; border-radius: 12px;
    font-size: 12px; font-weight: 500;
    color: rgba(42,32,26,.5);
    background: transparent; border: none; cursor: pointer;
    transition: background .2s, color .2s;
  }
  .sub-tab-btn.active {
    background: rgba(245,124,0,.12);
    color: var(--orange);
    font-weight: 600;
  }
  /* Admin tabs: 9-column grid with icon-above-text so nothing gets truncated */
  .admin-tabs-bar {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 2px;
    width: 100%;
  }
  .admin-tabs-bar .sub-tab-btn {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 6px 2px;
  }
  .admin-tab-emoji { font-size: 16px; line-height: 1; }
  .admin-tab-label { font-size: 8px; font-weight: 500; line-height: 1.1; white-space: nowrap; }
  .sub-section { display: none; }
  .sub-section.active { display: block; }

  /* ── Event / Course card hover ── */
  .event-card, .course-card { transition: border-color .2s, transform .2s; }
  .event-card:hover  { border-color: rgba(245,124,0,.5) !important; transform: translateY(-2px); }
  .course-card:hover { border-color: rgba(56,189,248,.45) !important; transform: translateY(-2px); }

  /* ── Vimeo / video embed ── */
  .vimeo-wrap {
    position: relative; width: 100%;
    padding-bottom: 56.25%; height: 0;
    border-radius: 14px; overflow: hidden;
    background: #0f1419; cursor: pointer;
  }
  .vimeo-wrap iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
  }
  .vimeo-thumb {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
  }
  .vimeo-play-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    background: linear-gradient(135deg, rgba(245,124,0,.07), rgba(56,189,248,.07));
    transition: background .2s;
  }
  .vimeo-wrap:hover .vimeo-play-overlay { background: rgba(0,0,0,.2); }
  .play-btn {
    width: 54px; height: 54px;
    background: var(--grad);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s, box-shadow .2s;
  }
  .vimeo-wrap:hover .play-btn { transform: scale(1.1); box-shadow: 0 0 24px rgba(245,124,0,.5); }

  /* ── Locked content overlay ── */
  .locked-wrap { position: relative; overflow: hidden; border-radius: 14px; }
  .locked-wrap .locked-blur { filter: blur(4px); pointer-events: none; user-select: none; }
  .locked-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
    background: rgba(11,14,20,.7);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    border-radius: 14px;
  }

  /* ── Skeleton loading ── */
  .skeleton {
    background: linear-gradient(90deg, rgba(42,32,26,.05) 25%, rgba(42,32,26,.1) 50%, rgba(42,32,26,.05) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 8px;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .skeleton-card { height: 220px; border-radius: 16px; }

  /* ── Progress bar ── */
  .progress-bar-bg { background: rgba(42,32,26,.1); border-radius: 4px; height: 4px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--grad); border-radius: 4px; transition: width .3s; }

  /* ── Resource list row ── */
  .res-row { transition: transform .2s; cursor: pointer; }
  .res-row:hover { transform: translateX(4px); }

  /* ── Schedule table ── */
  .sched-table { width: 100%; border-collapse: separate; border-spacing: 0 3px; }
  .sched-table th { color: rgba(42,32,26,.5); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 4px 6px; text-align: center; }
  .sched-table td { background: rgba(42,32,26,.04); padding: 7px 5px; text-align: center; font-size: 11px; color: rgba(42,32,26,.7); }
  .sched-table td:first-child { border-radius: 8px 0 0 8px; color: var(--orange); font-weight: 700; font-size: 11px; padding-left: 8px; }
  .sched-table td:last-child  { border-radius: 0 8px 8px 0; }
  .sched-table .has-class { background: rgba(245,124,0,.1); color: rgba(42,32,26,.85); }

  /* ── Membership plan cards ── */
  .plan-basic   { border: 1px solid rgba(56,189,248,.22);  background: rgba(56,189,248,.03); }
  .plan-premium { border: 1px solid rgba(245,124,0,.45); background: linear-gradient(135deg,rgba(245,124,0,.05),rgba(56,189,248,.05)); }
  .plan-vip     { border: 1px solid rgba(139,92,246,.45); background: linear-gradient(135deg,rgba(139,92,246,.05),rgba(245,124,0,.05)); }

  /* ── Before/after card ── */
  .ba-card { border-radius: 14px; overflow: hidden; border: 1px solid rgba(42,32,26,.06); }

  /* ── Glow backgrounds ── */
  .glow-orange { background: radial-gradient(ellipse at 50% 0%, rgba(245,124,0,.18) 0%, transparent 70%); }
  .glow-blue   { background: radial-gradient(ellipse at 50% 0%, rgba(56,189,248,.12) 0%, transparent 70%); }

  /* ── Notification banner ── */
  #notif-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    transform: translateY(-120%);
    transition: transform .4s cubic-bezier(.34,1.2,.64,1);
  }
  #notif-bar.show { transform: translateY(0); }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(12px);
    z-index: 300; opacity: 0; transition: opacity .3s, transform .3s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Modal ── */
  #modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: none; align-items: flex-end; justify-content: center;
  }
  #modal-overlay.open { display: flex; }
  .modal-bg {
    position: absolute; inset: 0;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .modal-sheet {
    position: relative; z-index: 1;
    width: 100%; max-width: 480px;
    background: #FFFFFF;
    border-radius: 24px 24px 0 0;
    border-top: 1px solid rgba(245,124,0,.3);
    padding: 20px 18px env(safe-area-inset-bottom, 28px);
    max-height: 90vh;
    overflow-y: auto;
  }
  @keyframes slideUp {
    from { transform: translateY(60px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  .modal-sheet.animate { animation: slideUp .32s cubic-bezier(.34,1.4,.64,1); }

  /* ── Spinner ── */
  .spin {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid rgba(42,32,26,.15);
    border-top-color: var(--orange);
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Misc ── */
  a { text-decoration: none; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .text-error { color: #f87171; }
  .text-success { color: #4ade80; }

  /* ════════════════════════════════════════
     LIGHT THEME — Tailwind text-white override
     Default: text-white → dark on cream/white surfaces.
     Exceptions force white back where the element sits over
     an image overlay, a colored button, or a dark bg.
  ════════════════════════════════════════ */
  body .text-white         { color: var(--text); }
  body .text-white\/90     { color: rgba(42,32,26,.9); }
  body .text-white\/80     { color: rgba(42,32,26,.82); }
  body .text-white\/70     { color: rgba(42,32,26,.75); }
  body .text-white\/60     { color: rgba(42,32,26,.65); }
  body .text-white\/50     { color: rgba(42,32,26,.55); }
  body .text-white\/45     { color: rgba(42,32,26,.5); }
  body .text-white\/40     { color: rgba(42,32,26,.45); }
  body .text-white\/30     { color: rgba(42,32,26,.35); }
  body .text-white\/25     { color: rgba(42,32,26,.3); }
  body .text-white\/20     { color: rgba(42,32,26,.25); }
  body .text-white\/10     { color: rgba(42,32,26,.15); }
  body .text-white\/5      { color: rgba(42,32,26,.08); }

  /* Exception A: text-white inside .absolute (image overlays) stays white.
     Restricted to .text-white classes only — badges with their own color
     (badge-online, badge-gold, etc) preserve their color. */
  body .absolute.text-white,
  body .absolute .text-white       { color: #fff; }
  body .absolute.text-white\/90,
  body .absolute .text-white\/90   { color: rgba(255,255,255,.9); }
  body .absolute.text-white\/80,
  body .absolute .text-white\/80   { color: rgba(255,255,255,.8); }
  body .absolute.text-white\/70,
  body .absolute .text-white\/70   { color: rgba(255,255,255,.7); }
  body .absolute.text-white\/60,
  body .absolute .text-white\/60   { color: rgba(255,255,255,.6); }
  body .absolute.text-white\/50,
  body .absolute .text-white\/50   { color: rgba(255,255,255,.5); }
  body .absolute.text-white\/40,
  body .absolute .text-white\/40   { color: rgba(255,255,255,.4); }
  body .absolute.text-white\/30,
  body .absolute .text-white\/30   { color: rgba(255,255,255,.3); }
  body .absolute.text-white\/20,
  body .absolute .text-white\/20   { color: rgba(255,255,255,.2); }

  /* Exception B: colored solid buttons keep their white text */
  body .btn-grad, body .btn-grad *,
  body .btn-accent, body .btn-accent * { color: #fff; }
  body .btn-paypal, body .btn-paypal * { color: #003087; }

  /* Exception C: modal-bg overlay (dark backdrop) */
  body .modal-bg .text-white       { color: #fff; }

  /* Exception D: nav active label uses accent color (already set, but reinforce) */
  body .nav-tab.active .nav-label  { color: var(--accent-orange); }

  /* Tailwind bg-white/X on light bg — turn into subtle dark tints */
  body .bg-white\/20  { background-color: rgba(42,32,26,.12); }
  body .bg-white\/10  { background-color: rgba(42,32,26,.06); }
  body .bg-white\/5   { background-color: rgba(42,32,26,.04); }

  /* Empty-state / load-error icon container subtle bg */
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     NOTIFICATION BANNER
══════════════════════════════════════ -->
<div id="notif-bar" class="px-4 pt-4 pb-2">
  <div style="background:#FFFFFF; border:1px solid rgba(245,124,0,.25); border-radius:18px;" class="p-3.5 flex items-center gap-3 shadow-2xl">
    <div class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0" style="background:var(--grad)">
      <i data-lucide="bell" class="w-5 h-5 text-white"></i>
    </div>
    <div class="flex-1 min-w-0">
      <p class="text-sm font-semibold leading-tight" style="color:var(--text)">¿Activar notificaciones?</p>
      <p class="text-xs mt-0.5" style="color:var(--text-muted)">Entérate de eventos y novedades</p>
    </div>
    <div class="flex gap-2 flex-shrink-0">
      <button onclick="activateNotif()" class="btn-grad text-xs px-3 py-1.5 rounded-lg">Activar</button>
      <button onclick="dismissNotif()" class="text-xs px-3 py-1.5 rounded-lg" style="background:rgba(42,32,26,.05); color:var(--text-muted)">Ahora no</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     HEADER
══════════════════════════════════════ -->
<header class="fixed top-0 left-0 right-0 z-40 flex items-center justify-between px-5 py-3.5"
  style="background:rgba(255,255,248,.92); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:1px solid rgba(245,124,0,.15);">

  <!-- Left: tier badge (hidden when logged out) -->
  <div id="header-tier" class="w-9" style="display:none">
    <span id="header-tier-badge" class="text-xs font-bold px-2 py-0.5 rounded-full"></span>
  </div>
  <div id="header-tier-placeholder" class="w-9"></div>

  <!-- Center: logo -->
  <div class="flex items-center">
    <img src="/logo.png" alt="Flowback Hub" style="width:120px; height:auto; display:block;"
      onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block'">
    <span id="logo-fallback" class="text-xl font-black serif grad-text" style="display:none; letter-spacing:-.5px">Flowback Hub</span>
  </div>

  <!-- Right: bell OR user avatar -->
  <div class="flex items-center gap-2">
    <button onclick="showNotifBar()" class="w-9 h-9 rounded-full flex items-center justify-center"
      style="background:rgba(245,124,0,.1); border:1px solid rgba(245,124,0,.2);">
      <i data-lucide="bell" class="w-4 h-4" style="color:var(--orange)"></i>

function escHtml(str) {
  if (!str) return '';

    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function extractVimeoId(url) {
  if (!url) return null;
  const m = String(url).match(/(?:vimeo\.com\/(?:video\/)?|^)(\d+)/);
  return m ? m[1] : null;
}

function formatEventDate(dateStr, timeStr) {
  if (!dateStr) return '';
  try {
    const d   = new Date(dateStr + 'T00:00:00');
    const day = d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    return timeStr ? `${day} · ${timeStr.slice(0,5)}` : day;
  } catch { return dateStr; }
}

function formatDuration(hours) {
  if (!hours) return '';
  const h = Math.floor(hours);
  const m = Math.round((hours - h) * 60);
  if (h && m) return `${h}h ${m}min`;
  if (h) return `${h}h`;
  return `${m}min`;
}

function tierLabel(tier) {
  const map = { free: 'Gratis', basica: 'Básica', premium: 'Premium', vip: 'VIP' };

/* Convert '#RRGGBB' to 'rgba(r,g,b,a)' for icon backgrounds.
   Passes through anything that already starts with 'rgb' / 'rgba'. */
function _hexToRgba(color, alpha) {
  if (!color) return `rgba(255,255,255,${alpha})`;
  if (/^rgba?\(/i.test(color)) return color;
  const hex = color.replace('#', '').trim();
  if (hex.length === 6) {
    const r = parseInt(hex.slice(0,2), 16);
    const g = parseInt(hex.slice(2,4), 16);
    const b = parseInt(hex.slice(4,6), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }
  return color;
}

/* ═══════════════════════════════════════════
   SECTION SWITCHING
═══════════════════════════════════════════ */
const ALL_SECTIONS = ['inicio', 'eventos', 'clases-gratis', 'cursos', 'tribu', 'agenda', 'grabadas', 'documentos', 'admin'];

function switchSection(name) {
  currentSection = name;

  ALL_SECTIONS.forEach(id => {
    const el = document.getElementById('sec-' + id);
    if (el) el.classList.toggle('active', id === name);
  });

  ALL_SECTIONS.forEach(id => {
    const btn = document.getElementById('nav-' + id);
    if (btn) btn.classList.toggle('active', id === name);
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });

  if (name === 'eventos'      && !window._loaded_eventos)    loadEventos();
  if (name === 'clases-gratis'&& !window._loaded_clases)     loadClasesGratis();
  if (name === 'cursos'       && !window._loaded_cursos)     loadCursos();
  if (name === 'agenda'       && !window._loaded_agenda)     loadAgenda();
  if (name === 'grabadas'     && !window._loaded_grabadas)   loadGrabadas();
  if (name === 'documentos'   && !window._loaded_documentos) loadDocumentos();
  if (name === 'admin'        && !window._loaded_admin)      loadAdmin();
}

function handleSignedOut() {
  currentUser  = null;
  userProfile  = null;
  updateHeader();
  updateUIForLoggedOutUser();
}

/* ═══════════════════════════════════════════
   UI STATE: LOGGED IN
═══════════════════════════════════════════ */
function updateUIForLoggedInUser() {
  renderNavTabs();

  const tribu = document.getElementById('sec-tribu');
  if (tribu) renderTribuSection();

  // Reset loaded flags so member sections re-fetch with the new auth state
  window._loaded_agenda     = false;
  window._loaded_grabadas   = false;
  window._loaded_documentos = false;

  // If the user is already on a member section, reload it now
  // (switchSection won't fire again because currentSection didn't change)
  if (currentSection === 'agenda')     loadAgenda();
  if (currentSection === 'grabadas')   loadGrabadas();
  if (currentSection === 'documentos') loadDocumentos();

  if (document.getElementById('paypal-basica')) renderPaypalButtons();

  const memberTabs = ['inicio', 'eventos', 'clases-gratis', 'cursos', 'agenda', 'grabadas', 'documentos', 'tribu', 'admin'];
  if (!memberTabs.includes(currentSection)) switchSection('inicio');
}

/* ═══════════════════════════════════════════
   UI STATE: LOGGED OUT
═══════════════════════════════════════════ */
function updateUIForLoggedOutUser() {
  renderNavTabs();

  const tribu = document.getElementById('sec-tribu');
  if (tribu) renderTribuSection();

  if (document.getElementById('paypal-basica')) renderPaypalButtons();

  // If on a member-only section, redirect to tribu
  if (['agenda', 'grabadas', 'documentos'].includes(currentSection)) {
    switchSection('tribu');
  }
}

function skeletonCards(n) {
  return Array.from({ length: n }, () =>
    `<div class="skeleton skeleton-card mb-4"></div>`

      <div class="flex items-start justify-between mb-3">
        <div>
          <p class="text-xs font-bold tracking-widest mb-1" style="color:${visual.color}">${visual.emoji} ${escHtml(p.name.toUpperCase())}</p>

        ${(p.features || []).map(f => `

          <i data-lucide="check-circle" class="w-3.5 h-3.5 text-green-400 flex-shrink-0"></i><span>${escHtml(f)}</span>

   AUTH ACTIONS
═══════════════════════════════════════════ */
async function doLogin() {
  const email    = document.getElementById('login-email')?.value.trim();
  const password = document.getElementById('login-password')?.value;
  const errEl    = document.getElementById('login-error');
  const btn      = document.getElementById('login-btn');
  if (!email || !password) { showAuthError(errEl, 'Completa todos los campos'); return; }

  setLoading(btn, true);
  const { error } = await sb.auth.signInWithPassword({ email, password });
  setLoading(btn, false);

  if (error) {
    showAuthError(errEl, translateAuthError(error.message));
  } else {
    errEl && (errEl.style.display = 'none');
    showToast('¡Bienvenido de vuelta!');
  }
}

async function doRegister() {
  const name     = document.getElementById('reg-name')?.value.trim();
  const email    = document.getElementById('reg-email')?.value.trim();
  const password = document.getElementById('reg-password')?.value;
  const errEl    = document.getElementById('reg-error');
  const btn      = document.getElementById('reg-btn');

  if (!name || !email || !password) { showAuthError(errEl, 'Completa todos los campos'); return; }
  if (password.length < 6) { showAuthError(errEl, 'La contraseña debe tener al menos 6 caracteres'); return; }

  setLoading(btn, true);
  const { data, error } = await sb.auth.signUp({
    email, password,
    options: { data: { full_name: name } }
  });
  setLoading(btn, false);

  if (error) {
    showAuthError(errEl, translateAuthError(error.message));
  } else if (data.user && !data.session) {
    // Email confirmation required
    errEl && (errEl.style.display = 'none');
    showToast('¡Cuenta creada! Revisa tu email para confirmar.');
  } else {
    errEl && (errEl.style.display = 'none');
    showToast('¡Bienvenido a Flowback Hub!');
  }
}

async function doForgotPassword() {
  const email = document.getElementById('forgot-email')?.value.trim();
  const msgEl = document.getElementById('forgot-msg');
  const btn   = document.getElementById('forgot-btn');
  if (!email) { showMsg(msgEl, 'Ingresa tu email', true); return; }

  setLoading(btn, true);
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin
  });
  setLoading(btn, false);

  if (error) {
    showMsg(msgEl, translateAuthError(error.message), true);
  } else {
    showMsg(msgEl, '¡Listo! Revisa tu email para resetear tu contraseña.', false);
    btn.disabled = true;
  }
}

async function doSignOut() {
  console.log('[doSignOut] iniciando logout');
  showToast('Cerrando sesión…');

  // Race the signOut against a 5s timeout so the UI never gets stuck if the
  // network call hangs (we'll fall through to the localStorage purge + reload).
  try {
    await Promise.race([
      sb.auth.signOut().then(({ error }) => {
        if (error) console.error('[doSignOut] supabase signOut error:', error);
      }),
      new Promise(resolve => setTimeout(() => {
        console.warn('[doSignOut] timeout 5s — forcing local cleanup');
        resolve();
      }, 5000)),
    ]);
  } catch (err) {
    console.error('[doSignOut] exception:', err);
  }

  // Defensively purge any persisted Supabase session keys in case signOut
  // didn't (some browsers / extensions block the storage clear).
  try {
    Object.keys(localStorage).forEach(k => {
      if (k.startsWith('sb-') || k.toLowerCase().includes('supabase')) {
        localStorage.removeItem(k);
      }
    });
  } catch (e) { console.warn('[doSignOut] storage clear failed:', e); }

  // Hard reload to a guaranteed-clean state. This handles every edge case
  // (stuck modals, half-rendered admin, lingering iframes) in one shot.
  window.location.reload();
}

function openChangePasswordFlow() {

/* ── Auth UI helpers ── */
function showAuthError(el, msg) {
  if (!el) return;
  el.textContent = msg;
  el.style.display = 'block';
}
function showMsg(el, msg, isError) {
  if (!el) return;
  el.textContent = msg;
  el.className = `text-xs ${isError ? 'text-error' : 'text-success'}`;
  el.style.display = 'block';
}
function setLoading(btn, loading) {
  if (!btn) return;
  btn.disabled = loading;
  if (loading) {
    btn._origText = btn.textContent;
    btn.innerHTML = '<div class="spin mx-auto"></div>';
  } else {
    btn.innerHTML = btn._origText || btn.innerHTML;
  }
}
function translateAuthError(msg) {
  if (!msg) return 'Error desconocido';
  if (msg.includes('Invalid login'))        return 'Email o contraseña incorrectos';
  if (msg.includes('Email not confirmed'))  return 'Confirma tu email antes de iniciar sesión';
  if (msg.includes('already registered'))  return 'Este email ya tiene una cuenta';
  if (msg.includes('rate limit'))           return 'Demasiados intentos. Espera un momento.';
  if (msg.includes('password'))             return 'La contraseña debe tener al menos 6 caracteres';
  return msg;
}

/* ═══════════════════════════════════════════
   LOAD EVENTOS (events + webinars merged)
═══════════════════════════════════════════ */
async function loadEventos() {
  window._loaded_eventos = true;
  const container = document.getElementById('eventos-list');
  if (!container) return;

  try {
    const today = new Date().toISOString().split('T')[0];
    const [{ data: events, error: e1 }, { data: webinars, error: e2 }] = await Promise.all([
      sb.from('events').select('*').eq('is_active', true).gte('event_date', today).order('event_date').order('event_time'),
      sb.from('webinars').select('*').eq('is_active', true).gte('date', today).order('date').order('time'),
    ]);
    if (e1 || e2) throw e1 || e2;

    const combined = [
      ...(events   || []).map(e => ({ ...e, _src: 'event',   _date: e.event_date, _time: e.event_time   })),
      ...(webinars || []).map(w => ({ ...w, _src: 'webinar', _date: w.date,        _time: w.time         })),
    ].sort((a, b) => (a._date + (a._time || '')).localeCompare(b._date + (b._time || '')));

    if (!combined.length) {
      container.innerHTML = renderEmptyState('calendar-x', 'No hay eventos próximos', 'Vuelve pronto para ver nuevas fechas');
      lucide.createIcons(); return;
    }

    container.innerHTML = combined.map(renderEventCard).join('');
    lucide.createIcons();
  } catch {
    container.innerHTML = renderLoadError();
  }
}

/* ═══════════════════════════════════════════
   PAYPAL CHECKOUT — montos derivados de tabla `plans` (appPlans)
═══════════════════════════════════════════ */
function handleJoinTribu(planTier) {
  if (!currentUser) { openModal(); return; }
  const pp = document.getElementById('paypal-' + planTier);
  if (pp) pp.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function paypalSdkReady() {
  return typeof window.paypal !== 'undefined' && !!window.paypal.Buttons;
}

function waitForPaypalSdk(cb, attempt = 0) {
  if (paypalSdkReady()) { console.log('[PayPal] SDK listo'); cb(); return; }
  if (attempt > 30) { console.error('[PayPal] SDK no cargó tras 9s — abortando'); return; }
  console.log('[PayPal] SDK no listo, reintento #' + (attempt + 1));
  setTimeout(() => waitForPaypalSdk(cb, attempt + 1), 300);
}

function renderPaypalButtons() {
  waitForPaypalSdk(() => {
    console.log('[PayPal] renderPaypalButtons() — currentUser:', !!currentUser, '· planes:', appPlans.length);
    appPlans.forEach(plan => {
      const amount    = _planAmountUsd(plan);
      const label     = `Plan ${plan.name} · Flowback Hub`;
      const container = document.getElementById('paypal-' + plan.tier);
      const fallback  = document.getElementById('join-' + plan.tier);
      if (!container) { console.log('[PayPal] contenedor no existe: paypal-' + plan.tier); return; }

      container.innerHTML = '';
      if (currentUser) {
        container.style.display = 'block';
        if (fallback) fallback.style.display = 'none';
        mountPaypal(container, plan.tier, amount, label);
      } else {
        container.style.display = 'none';
        if (fallback) fallback.style.display = 'block';
      }
    });
  });
}

function renderModalPaypalButtons() {
  waitForPaypalSdk(() => {
    appPlans.forEach(plan => {
      const container = document.getElementById('paypal-modal-' + plan.tier);
      if (!container) return;
      container.innerHTML = '';
      mountPaypal(container, plan.tier, _planAmountUsd(plan), `Plan ${plan.name} · Flowback Hub`);
    });
  });
}

function renderTribuPaypalButtons() {
  if (!currentUser) return;
  waitForPaypalSdk(() => {
    const containers = document.querySelectorAll('[id^="paypal-planes-"]');
    console.log('[PayPal] Tribu>Planes contenedores encontrados:', containers.length);
    containers.forEach(container => {
      const tier   = container.dataset.plan;
      const amount = container.dataset.amount;
      const label  = container.dataset.label || ('Plan ' + tier);
      if (!tier || !amount) { console.warn('[PayPal] data-plan o data-amount falta', container.id); return; }
      container.innerHTML = '';
      mountPaypal(container, tier, amount, label);
    });
  });
}

function mountPaypal(container, tier, amount, label) {
  console.log('[PayPal] montando plan:', tier, '· monto:', amount, '· container:', container.id);
  if (!paypalSdkReady()) { console.warn('[PayPal] SDK no disponible al montar'); return; }

  const buttons = paypal.Buttons({
    style: { layout: 'vertical', color: 'gold', shape: 'pill', label: 'paypal', height: 40 },
    createOrder: (data, actions) => {
      console.log('[PayPal] createOrder', tier, amount);
      return actions.order.create({
        intent: 'CAPTURE',
        purchase_units: [{
          description: label,
          amount: { currency_code: 'USD', value: amount },
        }],
      });
    },
    onApprove: async (data, actions) => {
      console.log('[PayPal] onApprove', tier, data.orderID);
      try {
        const details = await actions.order.capture();
        await onPaypalSuccess(tier, data.orderID, amount, details);
      } catch (err) {
        console.error('[PayPal] capture error', err);
        showToast('Error al confirmar el pago. Intenta de nuevo.', true);
      }
    },
    onError: (err) => {
      console.error('[PayPal] button error', err);
      showToast('Error con PayPal. Intenta de nuevo.', true);
    },
    onCancel: (data) => {
      console.log('[PayPal] cancelado por el usuario', data);
    },
  });

  if (!buttons.isEligible || !buttons.isEligible()) {
    console.warn('[PayPal] botones no elegibles para este contexto:', tier);
    return;
  }

  buttons.render(container).then(() => {
    console.log('[PayPal] render OK:', container.id);
  }).catch(err => {
    console.error('[PayPal] render error en ' + container.id, err);
  });
}

async function onPaypalSuccess(plan, orderID, amount, details) {
  if (!currentUser) { showToast('Sesión expirada. Inicia sesión.', true); return; }

  const { error: payErr } = await sb.from('payments').insert({
    user_id:        currentUser.id,
    amount:         Number(amount),
    currency:       'USD',
    method:         'paypal',
    status:         'confirmed',
    reference_code: orderID,
    confirmed_at:   new Date().toISOString(),
  });
  if (payErr) console.error('payments insert error', payErr);

  const { error: profErr } = await sb.from('profiles')
    .update({ tier: plan })
    .eq('user_id', currentUser.id);
  if (profErr) {
    console.error('profile tier update error', profErr);
    showToast('Pago recibido, pero no pudimos actualizar tu plan. Contacta a soporte.', true);
    return;
  }

  if (userProfile) userProfile.tier = plan;
  showToast('¡Bienvenido a la Tribu!');
  updateHeader();
  updateUIForLoggedInUser();
}

═══════════════════════════════════════════ */
async function loadCursos() {
  window._loaded_cursos = true;
  const container = document.getElementById('cursos-list');
  if (!container) return;

  try {
    const { data: courses, error } = await sb
      .from('courses')
      .select('*')
      .eq('is_active', true)
      .order('order_index', { nullsLast: true })
      .order('created_at', { ascending: false });
    if (error) throw error;

    // Short-circuit on empty BEFORE the purchases query
    if (!courses || courses.length === 0) {
      container.innerHTML = renderEmptyState('graduation-cap', 'Sin cursos disponibles', 'Próximamente nuevos programas');
      lucide.createIcons(); return;
    }

    // If user is logged in, fetch their purchases
    let purchasedIds = new Set();
    if (currentUser) {
      const { data: purchases } = await sb
        .from('course_purchases')
        .select('course_id')
        .eq('user_id', currentUser.id);
      purchasedIds = new Set((purchases || []).map(p => p.course_id));
    }

    container.innerHTML = courses.map(c => renderCourseCard(c, purchasedIds.has(c.id))).join('');
    lucide.createIcons();
  } catch {
    container.innerHTML = renderLoadError();
  }
}

async function openCourseDetail(courseId) {
  const container = document.getElementById('cursos-list');
  if (!container) return;
  container.innerHTML = skeletonCards(3);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  try {
    const [{ data: course, error: cErr }, { data: lessons }] = await Promise.all([
      sb.from('courses').select('*').eq('id', courseId).single(),
      sb.from('lessons').select('*').eq('course_id', courseId).eq('is_active', true)
        .order('order_index', { nullsLast: true }),
    ]);
    if (cErr) throw cErr;

    let purchased = false;
    let progressMap = {};
    if (currentUser) {
      const [{ data: purchases }, { data: progRows }] = await Promise.all([
        sb.from('course_purchases').select('course_id')
          .eq('user_id', currentUser.id).eq('course_id', courseId),
        sb.from('video_progress').select('video_id,progress_percent,completed')
          .eq('user_id', currentUser.id)
          .in('video_id', (lessons || []).map(l => l.id).filter(Boolean)),
      ]);
      purchased = !!(purchases?.length);
      (progRows || []).forEach(p => { progressMap[p.video_id] = p; });
    }

    container.innerHTML = renderCourseDetail(course, lessons || [], purchased, progressMap);
    lucide.createIcons();
  } catch(err) {
    console.error('[Course detail] error:', err);
    container.innerHTML = `
      <div class="card rounded-2xl p-6 text-center mt-4">
        <i data-lucide="alert-triangle" class="w-8 h-8 mx-auto mb-3 text-orange-400"></i>
        <p class="text-white/50 mb-3">Error al cargar el curso</p>
        <button onclick="backToCursos()" class="btn-grad px-4 py-2 rounded-xl text-sm">← Volver</button>
      </div>`;
    lucide.createIcons();
  }
}

  const type  = lesson.content_type || 'video';

          ${lesson.description ? `<p class="text-sm text-white/60 mb-6 leading-relaxed">${escHtml(lesson.description)}</p>` : ''}
          <div class="flex flex-col gap-2">
            <a href="${escHtml(url)}" target="_blank" rel="noopener"
              class="btn-grad py-3 rounded-xl text-sm flex items-center justify-center gap-2">

/* Resolve a stored URL: if it's already a full http(s) URL, return as-is;
   otherwise treat as private storage path and create a 1-hour signed URL. */
async function _resolveStorageUrl(stored, bucket) {
  if (!stored) return null;
  if (/^https?:\/\//i.test(stored)) return stored;
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(stored, 3600);
  if (error) { console.error('[signed url] error:', error); return null; }
  return data?.signedUrl || null;
}

async function closeLessonPlayer(lessonId) {

      { onConflict: 'user_id,video_id' }
    );
  }
}

/* Write HTML into a member-section container by re-querying the DOM right
   before writing. Same defensive pattern as _writeAdminContent — survives
   stale references caused by re-renders or races. */
function _writeMemberSection(containerId, html) {
  const el = document.getElementById(containerId);
  if (!el) { console.warn(`[member] #${containerId} not in DOM at write time`); return false; }
  el.innerHTML = html;
  try { lucide.createIcons(); }
  catch (e) { console.warn(`[member] lucide.createIcons failed for #${containerId}:`, e); }
  return true;
}

function renderEmptyMemberState(emoji, title, subtitle) {
  return `
    <div class="card rounded-2xl p-8 text-center mt-2">

async function loadAgenda() {
  window._loaded_agenda = true;
  const container = document.getElementById('agenda-list');
  if (!container) return;

  if (!currentUser)         { container.innerHTML = renderMemberGate();                    lucide.createIcons(); return; }
  if (!canAccess('basica')) { container.innerHTML = renderTierGate('basica','la Agenda'); lucide.createIcons(); return; }

  // Skeletons appear DURING the fetch, not before — so they can't get stuck if loadAgenda never runs.
  container.innerHTML = skeletonCards(4);

  try {
    const { data: videos, error } = await sb
      .from('videos')
      .select('*')
      .neq('tier_required', 'free')
      .eq('is_active', true)
      .order('order_index', { nullsLast: true })
      .order('created_at', { ascending: false });

    console.log('[Agenda] tier:', getUserTier(), '| videos:', videos?.length, '| error:', error);
    if (error) throw error;

    // No data → friendly empty state. Re-fetch container so a stale reference
    // (the original `container` captured before the await) can never leave
    // the user staring at skeletons.
    if (!videos || videos.length === 0) {
      const ok = _writeMemberSection('agenda-list', renderEmptyMemberState(
        '🎬',
        'No hay clases disponibles aún',
        'Próximamente nuevo contenido para miembros'
      ));
      console.log('[Agenda] empty state write success=' + ok);
      return;
    }

    let progressMap = {};
    const { data: prog } = await sb
      .from('video_progress').select('video_id, progress_percent').eq('user_id', currentUser.id);
    (prog || []).forEach(p => { progressMap[p.video_id] = p.progress_percent; });

    const html = videos.map(v =>
      renderVideoCard({ ...v, _progress: progressMap[v.id] ?? 0 }, !canAccess(v.tier_required))
    ).join('');
    const ok = _writeMemberSection('agenda-list', html);
    console.log('[Agenda] content write success=' + ok);
  } catch(err) {
    console.error('[Agenda] error:', err);
    _writeMemberSection('agenda-list', renderLoadError());
  }
}

/* ═══════════════════════════════════════════
   LOAD DOCUMENTOS (member-facing, filtered by user tier)
   Uses the same seq/race-protection pattern as _adminLoadSeq: bumps
   _docLoadSeq on entry, captures local seq, validates before and
   after the fetch and before every write.
═══════════════════════════════════════════ */
function _docSeqStale(seq) {
  if (seq !== _docLoadSeq) {
    console.log(`[Documentos] seq=${seq} stale (current=${_docLoadSeq}) — discarding`);
    return true;
  }
  return false;
}

async function loadDocumentos() {
  const seq = ++_docLoadSeq;
  const tag = '[Documentos] seq=' + seq;
  console.log(`${tag} ┌─ START`);
  window._loaded_documentos = true;

  // ── 1. Container guard (synchronous) ─────────────────────────────
  const container = document.getElementById('documentos-list');
  if (!container) { console.warn(`${tag} no container — abort`); return; }

  // ── 2. Member gate: no fetch needed if logged out ───────────────
  if (!currentUser) {
    container.innerHTML = renderMemberGate();
    lucide.createIcons();
    console.log(`${tag} └─ logged-out gate rendered`);
    return;
  }

  // ── 3. Skeleton synchronously BEFORE any await ──────────────────
  container.innerHTML = skeletonCards(3);

  try {
    // ── 4. Fetch (validate seq before AND after) ───────────────────
    if (_docSeqStale(seq)) return;
    const { data: docs, error } = await sb
      .from('documents')
      .select('*')
      .eq('is_active', true)
      .order('created_at', { ascending: false });
    if (_docSeqStale(seq)) return;

    console.log(`${tag} tier=${getUserTier()} · docs=${docs?.length ?? 'null'} · error=${error?.message ?? 'none'}`);
    if (error) throw error;

    // Client-side filter by tier (the user only sees what they can access)
    const accessible  = (docs || []).filter(d => canAccess(d.tier_required || 'free'));
    const lockedCount = (docs?.length || 0) - accessible.length;
    console.log(`${tag} accessible=${accessible.length} · locked=${lockedCount}`);

    // ── 5. Build & write (re-check seq right before each write) ────
    if (!accessible.length) {
      const hint = lockedCount > 0
        ? `Hay ${lockedCount} documento${lockedCount !== 1 ? 's' : ''} en planes superiores`
        : 'Próximamente más material descargable';
      const html = renderEmptyMemberState('📂', 'No hay documentos disponibles aún', hint) +
        (lockedCount > 0
          ? `<button onclick="switchSection('tribu'); setTimeout(()=>showSubTab('planes'),120)"
              class="btn-grad w-full py-2.5 rounded-xl text-sm mt-3">Ver planes →</button>`
          : '');
      if (_docSeqStale(seq)) return;
      const ok = _writeMemberSection('documentos-list', html);
      console.log(`${tag} └─ DONE empty-state · write success=${ok}`);
      return;
    }

    const cards = accessible.map(renderDocCard).join('');
    if (_docSeqStale(seq)) return;
    const ok = _writeMemberSection('documentos-list', cards);
    console.log(`${tag} └─ DONE ${accessible.length} cards · write success=${ok}`);
  } catch (err) {
    if (_docSeqStale(seq)) return;   // don't overwrite a fresher load's content with our error
    console.error(`${tag} error:`, err);
    _writeMemberSection('documentos-list', renderLoadError());
  }
}

      </div>
      ${url
        ? `<a href="${escHtml(url)}" target="_blank" rel="noopener"
            class="btn-grad w-full py-2.5 rounded-xl text-sm text-center flex items-center justify-center gap-2">
            <i data-lucide="external-link" class="w-4 h-4"></i>${ctaLabel}
          </a>`
        : `<button class="w-full py-2.5 rounded-xl text-sm font-medium text-white/40 cursor-default"
            style="background:rgba(42,32,26,.05); border:1px solid rgba(42,32,26,.1)">URL no disponible</button>`

    .from('profiles')

  if (error) {
    if (msgEl) { msgEl.textContent = 'Error al guardar'; msgEl.className = 'text-xs mt-1 text-error'; msgEl.style.display = 'block'; }

    if (userProfile) userProfile.full_name = name;

    showToast('Nombre actualizado');
    // refresh tribu section
    const c = document.getElementById('tribu-content');
    if (c) { renderTribuMember(c); lucide.createIcons(); }
  }
}

/* Monotonic generation counter for admin tab loads. Every loader bumps this
   at entry and captures the new value as its `seq`. Before writing to the
   DOM, the loader (and _writeAdminContent) checks `seq === _adminLoadSeq`.
   If a newer loader has bumped past us, our write is silently discarded.
   Net effect: rapid tab clicks can never let a stale fetch clobber the
   freshest content. We don't truly abort the in-flight fetch (Supabase JS
   doesn't expose AbortController by default) — we just ignore its result. */
let _adminLoadSeq = 0;

function _adminSeqStale(seq, label) {
  if (seq !== _adminLoadSeq) {
    console.log(`[Admin ${label}] discarding stale result (seq ${seq} ≠ current ${_adminLoadSeq})`);
    return true;
  }
  return false;
}

/* Reorder controls: ↑ ↓ buttons that swap order_index with the neighbor row.
   Boundary buttons are disabled. Table name is required to dispatch the update.
   `scope` (optional) confines the reorder to rows where {scopeCol = scopeVal}
   — used for landing_blocks so benefits don't swap with resources. */
function _renderReorderControls(table, id, isFirst, isLast, scope) {
  const safeId = String(id).replace(/'/g, "\\'");
  const upDisabled   = isFirst ? 'disabled style="opacity:.25;cursor:not-allowed;"' : '';
  const downDisabled = isLast  ? 'disabled style="opacity:.25;cursor:not-allowed;"' : '';
  const scopeArg = scope
    ? `,'${String(scope.col).replace(/'/g,"\\'")}','${String(scope.val).replace(/'/g,"\\'")}'`
    : '';
  return `
    <button onclick="_reorderAdminItem('${table}','${safeId}',-1${scopeArg})"
      class="btn-ghost text-xs px-2 py-1.5 rounded-lg flex items-center" title="Subir" ${upDisabled}>
      <i data-lucide="chevron-up" class="w-3.5 h-3.5"></i>
    </button>
    <button onclick="_reorderAdminItem('${table}','${safeId}',1${scopeArg})"
      class="btn-ghost text-xs px-2 py-1.5 rounded-lg flex items-center" title="Bajar" ${downDisabled}>
      <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
    </button>`;
}

/* Swap order_index between the clicked item and its neighbor (dir = -1 up, +1 down).
   Lessons are scoped by _adminLessonsCourseId. Uses current visual position
   (idx in the ASC-sorted list) as fallback when order_index is null. */
async function _reorderAdminItem(table, id, dir, scopeCol, scopeVal) {
  try {
    let query = sb.from(table).select('id,order_index')
      .order('order_index', { nullsLast: true })
      .order('created_at', { ascending: false });
    if (table === 'lessons' && _adminLessonsCourseId) {
      query = query.eq('course_id', _adminLessonsCourseId);
    }
    // Generic scope filter (used by landing_blocks to swap only within a section)
    if (scopeCol) query = query.eq(scopeCol, scopeVal);
    const { data, error } = await query;
    if (error) throw error;

    const items = data || [];
    const idx = items.findIndex(x => String(x.id) === String(id));
    if (idx === -1) return;
    const targetIdx = idx + dir;
    if (targetIdx < 0 || targetIdx >= items.length) return;

    const a = items[idx];
    const b = items[targetIdx];
    const aOrder = a.order_index ?? idx;
    const bOrder = b.order_index ?? targetIdx;

    const [r1, r2] = await Promise.all([
      sb.from(table).update({ order_index: bOrder }).eq('id', a.id),
      sb.from(table).update({ order_index: aOrder }).eq('id', b.id),
    ]);
    if (r1.error || r2.error) throw (r1.error || r2.error);

    // Reload the appropriate view
    if (table === 'videos')         loadAdminVideos();
    else if (table === 'courses')   loadAdminCursos();
    else if (table === 'webinars')  loadAdminWebinars();
    else if (table === 'plans')     { await loadPlans(); loadAdminPlanes(); }
    else if (table === 'landing_blocks') { await loadLandingBlocks(); loadAdminBloques(); }
    else if (table === 'lessons' && _adminLessonsCourseId) {
      loadAdminLecciones(_adminLessonsCourseId, _adminLessonsCourseTitle);
    }
  } catch (err) {
    console.error('[reorder] error:', err);
    showToast('Error al reordenar: ' + (err?.message || err), true);
  }
}

/* Get #admin-tab-content, restoring it via renderAdminShell() if it went
   missing. The whole "skeletons eternos" bug class boils down to writing
   into a container that no longer lives in the DOM — this function ensures
   that never happens silently. */
function _ensureAdminTabContent() {
  let target = document.getElementById('admin-tab-content');
  if (target) return target;
  console.warn('[admin] #admin-tab-content missing — re-rendering shell to restore it');
  if (!document.getElementById('admin-content')) {
    console.error('[admin] #admin-content also missing — sec-admin not in DOM');
    return null;
  }
  renderAdminShell();
  return document.getElementById('admin-tab-content');
}

/* Write HTML into #admin-tab-content. Schedules the write on the next
   animation frame so the browser has committed any pending DOM updates
   before we touch innerHTML. If `seq` is provided and doesn't match the
   current _adminLoadSeq, the write is skipped (stale fetch result).
   Returns Promise<boolean> — true if the write committed. */
function _writeAdminContent(html, seq) {
  return new Promise(resolve => {
    // Pre-rAF stale check
    if (seq !== undefined && seq !== _adminLoadSeq) {
      console.log(`[admin] write skipped (stale seq ${seq} vs current ${_adminLoadSeq})`);
      resolve(false);
      return;
    }
    requestAnimationFrame(() => {
      // Re-check after rAF — more time has passed, more chances of becoming stale
      if (seq !== undefined && seq !== _adminLoadSeq) {
        console.log(`[admin] write skipped after rAF (stale seq ${seq} vs current ${_adminLoadSeq})`);
        resolve(false);
        return;
      }
      const target = _ensureAdminTabContent();
      if (!target) {
        console.warn('[admin] _writeAdminContent: container unavailable after restore attempt');
        resolve(false);
        return;
      }
      target.innerHTML = html;
      try { lucide.createIcons(); }
      catch (e) { console.warn('[admin] lucide.createIcons failed:', e); }
      const verify = document.getElementById('admin-tab-content');
      const cs = verify ? getComputedStyle(verify) : null;
      console.log(
        `[admin] wrote ${html.length} chars · seq=${seq} · verifyLen=${verify?.innerHTML.length}` +
        ` · display=${cs?.display} · offsetH=${verify?.offsetHeight}`
      );
      resolve(true);
    });
  });
}

/* ── Shared admin tab loader ──
   Logs data/error, shows real error message, always shows Agregar button.
   RLS returning [] is handled: user sees empty state + Agregar, not stuck skeletons. */
async function _loadAdminTab({ queryFn, label, type, cols, emptyEmoji, emptyTitle, emptyHint, reorderTable }) {
  // Bump the load counter — any in-flight loader becomes stale from this
  // moment on, and its eventual write will be discarded.
  const seq = ++_adminLoadSeq;
  console.log(`[Admin ${label}] starting · seq=${seq}`);

  // SYNCHRONOUS skeleton render BEFORE any async work. Guarantees the user
  // sees a loading state immediately and that #admin-tab-content exists.
  const initial = _ensureAdminTabContent();
  if (!initial) { console.warn(`[Admin ${label}] container unavailable at start`); return; }
  initial.innerHTML = skeletonCards(3);

  try {
    const { data, error } = await queryFn();
    if (_adminSeqStale(seq, label)) return;

    console.log(`[Admin ${label}]`, { count: data?.length ?? 'null', error, seq });
    if (error) throw error;

    const rows = data?.length
      ? data.map((v, i) => renderAdminItemRow(cols, v, type,
          reorderTable ? { table: reorderTable, isFirst: i === 0, isLast: i === data.length - 1 } : null
        )).join('')
      : null;

    const body = rows
      ? rows
      : renderAdminEmptyState(
          emptyEmoji || '📭',
          emptyTitle || `No hay ${label.toLowerCase()} creados aún`,
          emptyHint  || 'Agregá el primero con el botón + Agregar'
        );
    const html = renderAdminListHeader(label, type) + body;
    const ok = await _writeAdminContent(html, seq);
    console.log(`[Admin ${label}] write success=${ok} · seq=${seq}`);
  } catch(err) {
    if (_adminSeqStale(seq, label)) return;
    console.error(`[Admin ${label}] error:`, err);
    await _writeAdminContent(renderAdminListHeader(label, type) +
      `<div class="card rounded-2xl p-6 text-center mt-1"
          style="border-color:rgba(245,124,0,.3);">
         <i data-lucide="alert-triangle" class="w-8 h-8 mx-auto mb-3 text-orange-400"></i>
         <p class="font-semibold text-white mb-1">Error al cargar ${label}</p>
         <p class="text-xs text-white/50 mb-3 font-mono">${escHtml(err?.message || String(err))}</p>
         <p class="text-xs text-white/25 mb-4 leading-relaxed">
           Si es un error de permisos (42501 / PGRST301), agregá en Supabase una policy<br>
           <code class="text-orange-400/70">FOR SELECT USING (auth.email() IN ('hi@wapnix.com','hi@monkeia.com','contacto@flowback.cl','jimmylavinfeldman@gmail.com'))</code>
         </p>
         <button onclick="switchAdminTab(_adminCurrentTab)"
           class="btn-grad text-xs px-4 py-2 rounded-xl">Reintentar</button>
       </div>`, seq);
  }
}

async function saveAdminPlan() {
  const id     = document.getElementById('ap_id')?.value;
  const errEl  = document.getElementById('admin-form-error');
  const btn    = document.getElementById('admin-save-btn');
  if (!id) { errEl.textContent = 'Plan inválido (falta id)'; errEl.style.display = 'block'; return; }

  // Collect feature rows, drop empties
  const features = Array.from(document.querySelectorAll('#ap_features_list .ap-feature-input'))
    .map(i => i.value.trim())
    .filter(Boolean);

  const payload = {
    name:            document.getElementById('ap_name').value.trim() || null,
    price_clp:       parseInt(document.getElementById('ap_price_clp').value, 10) || 0,
    price_usd:       parseFloat(document.getElementById('ap_price_usd').value) || 0,
    period:          document.getElementById('ap_period').value.trim() || null,
    period_months:   parseInt(document.getElementById('ap_period_months').value, 10) || 1,
    savings_percent: parseInt(document.getElementById('ap_savings').value, 10) || 0,
    badge:           document.getElementById('ap_badge').value.trim() || null,
    features,
    is_active:       document.getElementById('ap_is_active').checked,
  };

  if (!payload.name) { errEl.textContent = 'El campo "Nombre" es obligatorio'; errEl.style.display = 'block'; return; }
  errEl.style.display = 'none';

  console.log('[saveAdminPlan] payload:', payload);
  setLoading(btn, true);
  const { data, error } = await sb.from('plans').update(payload).eq('id', id).select();
  setLoading(btn, false);

  if (!error && (!data || data.length === 0)) {
    alert('No se guardó (posible bloqueo por RLS). Revisá las policies de la tabla plans.');
    return;
  }
  if (error) {
    console.error('[saveAdminPlan] error:', error);
    alert('Error: ' + (error.message || 'desconocido'));
    errEl.textContent = error.message || 'Error al guardar';
    errEl.style.display = 'block';
    return;
  }

  // Refresh cache so the rest of the app sees the new prices/features
  await loadPlans();

  closeAdminModal();
  showToast('Plan actualizado ✓');
  loadAdminPlanes();
}

/* ═══════════════════════════════════════════
   ADMIN TAB — Bloques (landing_blocks)
═══════════════════════════════════════════ */
const ADMIN_BLOQUE_SECTIONS = {
  benefits:  { label: '🌱 Lo que obtendrás · Clases', defaultEmoji: '✨' },
  resources: { label: '🎁 Recursos destacados · Clases', defaultEmoji: '📌' },
};

async function loadAdminBloques() {
  const seq = ++_adminLoadSeq;
  const t0  = performance.now();
  const tag = '[Admin Bloques] seq=' + seq;
  console.log(`${tag} ┌─ START`);

  // Outer try/catch: anything thrown anywhere lands here, including
  // synchronous explosions that the previous version's inner try missed.
  try {
    // ── 1. ensure container ──────────────────────────────────────
    console.log(`${tag} │ 1 ensuring container…`);
    const c = _ensureAdminTabContent();
    if (!c) {
      console.error(`${tag} │ 1 FAIL: no container — aborting`);
      return;
    }
    console.log(`${tag} │ 1 OK`);

    // ── 2. write skeleton ────────────────────────────────────────
    console.log(`${tag} │ 2 writing skeleton`);
    c.innerHTML = skeletonCards(3);
    console.log(`${tag} │ 2 OK`);

    // ── 3. fetch (with 10s timeout to surface hangs as errors) ───
    console.log(`${tag} │ 3 fetching landing_blocks…`);
    let data, error;
    try {
      const result = await Promise.race([
        sb.from('landing_blocks').select('*').order('section').order('order_index', { nullsLast: true }),
        new Promise((_, rej) => setTimeout(() => rej(new Error('FETCH_TIMEOUT_10s')), 10000)),
      ]);
      ({ data, error } = result || {});
    } catch (fetchErr) {
      console.error(`${tag} │ 3 FETCH THREW:`, fetchErr?.message, fetchErr);
      throw fetchErr;
    }
    console.log(`${tag} │ 3 OK · count=${data?.length ?? 'null'} · error=${error ? error.message : 'none'}`);

    if (_adminSeqStale(seq, 'Bloques')) return;
    if (error) throw error;

    // ── 4. group rows by section ─────────────────────────────────
    console.log(`${tag} │ 4 grouping by section`);
    const bySection = {};
    Object.keys(ADMIN_BLOQUE_SECTIONS).forEach(s => bySection[s] = []);
    (data || []).forEach(b => {
      if (!bySection[b.section]) bySection[b.section] = [];
      bySection[b.section].push(b);
    });
    const counts = Object.entries(bySection).map(([s, arr]) => `${s}=${arr.length}`).join(', ');
    console.log(`${tag} │ 4 OK · ${counts}`);

    // ── 5. build HTML (inner try so one bad row doesn't kill all) ─
    console.log(`${tag} │ 5 building HTML`);
    let html;
    try {
      const sectionsHtml = Object.keys(ADMIN_BLOQUE_SECTIONS).map(section => {
        const meta  = ADMIN_BLOQUE_SECTIONS[section];
        const items = bySection[section] || [];
        let rowsHtml = '';
        try {
          rowsHtml = items.length
            ? items.map((b, i) => _renderAdminBloqueRow(b, i, items.length)).join('')
            : `<div class="card rounded-xl p-4 text-center mb-3">
                <p class="text-xs text-white/40">Sin bloques · tocá <span class="text-white/60">+ Agregar</span> y elegí esta sección</p>
               </div>`;
        } catch (rowErr) {
          console.error(`${tag} │ 5 ROW BUILD FAILED for section="${section}":`, rowErr);
          rowsHtml = `<div class="card rounded-xl p-3 text-xs text-red-400">Error renderizando bloques de "${escHtml(section)}": ${escHtml(rowErr.message || String(rowErr))}</div>`;
        }
        return `
          <p class="text-xs font-bold text-white/40 uppercase tracking-wider mb-2 mt-4">${escHtml(meta.label)}</p>
          ${rowsHtml}`;
      }).join('');

      html = `
        <div class="flex items-center justify-between mb-4">
          <p class="text-sm font-bold text-white/60 uppercase tracking-wide">Bloques de Landing</p>
          <button onclick="openAdminBloqueForm(null)"
            class="btn-grad text-xs px-3 py-2 rounded-xl flex items-center gap-1.5">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>Agregar
          </button>
        </div>
        ${sectionsHtml}
      `;
    } catch (htmlErr) {
      console.error(`${tag} │ 5 HTML BUILD FAILED:`, htmlErr);
      throw htmlErr;
    }
    console.log(`${tag} │ 5 OK · html length=${html.length}`);

    // ── 6. write ─────────────────────────────────────────────────
    console.log(`${tag} │ 6 calling _writeAdminContent`);
    let ok;
    try {
      ok = await _writeAdminContent(html, seq);
    } catch (writeErr) {
      console.error(`${tag} │ 6 WRITE THREW:`, writeErr?.message, writeErr);
      throw writeErr;
    }
    const elapsed = Math.round(performance.now() - t0);
    console.log(`${tag} └─ DONE · write success=${ok} · total ${elapsed}ms`);
  } catch (err) {
    if (_adminSeqStale(seq, 'Bloques')) return;
    const elapsed = Math.round(performance.now() - t0);
    console.error(`${tag} └─ EXCEPTION after ${elapsed}ms:`, err);
    if (err?.stack) console.error(`${tag} stack:`, err.stack);

    const isMissing = /landing_blocks/i.test(err?.message || '') || err?.code === 'PGRST205';
    const isTimeout = err?.message === 'FETCH_TIMEOUT_10s';
    try {
      await _writeAdminContent(`<div class="card rounded-2xl p-6 text-center mt-1" style="border-color:rgba(245,124,0,.3);">
        <i data-lucide="alert-triangle" class="w-8 h-8 mx-auto mb-3 text-orange-400"></i>
        <p class="font-semibold text-white mb-1">Error al cargar Bloques</p>
        <p class="text-xs text-white/50 mb-3 font-mono">${escHtml(err?.message || String(err))}</p>
        ${isTimeout ? `<p class="text-xs text-white/40 mb-3 leading-relaxed">
          La query a Supabase no respondió en 10 segundos. Revisá conexión y RLS.
        </p>` : ''}
        ${isMissing ? `<p class="text-xs text-white/40 mb-3 leading-relaxed">
          La tabla <code class="text-orange-400/70">landing_blocks</code> no existe todavía.
          Ejecutá la migración <code class="text-orange-400/70">migrations/2026-05-25_landing_blocks.sql</code>
          en el SQL editor de Supabase y reintentá.
        </p>` : ''}
        <button onclick="switchAdminTab('bloques')" class="btn-grad text-xs px-4 py-2 rounded-xl">Reintentar</button>
      </div>`, seq);
    } catch (catchWriteErr) {
      // If even writing the error card fails, log it — at least we'll know in console
      console.error(`${tag} catch: ALSO failed to write error card:`, catchWriteErr);
    }
  }
}

async function saveAdminBloque() {
  const id      = document.getElementById('ab_id')?.value;
  const errEl   = document.getElementById('admin-form-error');
  const btn     = document.getElementById('admin-save-btn');

  const payload = {
    section:      document.getElementById('ab_section').value,
    title:        document.getElementById('ab_title').value.trim() || null,
    subtitle:     document.getElementById('ab_subtitle').value.trim() || null,
    emoji:        document.getElementById('ab_emoji').value.trim() || null,
    icon:         document.getElementById('ab_icon').value.trim() || null,
    accent_color: document.getElementById('ab_accent_color').value.trim() || null,
    url:          document.getElementById('ab_url').value.trim() || null,
    order_index:  parseInt(document.getElementById('ab_order_index').value, 10) || 0,
    is_active:    document.getElementById('ab_is_active').checked,
  };

  if (!payload.title) {
    errEl.textContent = 'El título es obligatorio';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  setLoading(btn, true);
  let result;
  if (id) {
    result = await sb.from('landing_blocks').update(payload).eq('id', id).select();
  } else {
    result = await sb.from('landing_blocks').insert(payload).select();
  }
  setLoading(btn, false);

  const { data, error } = result;
  if (!error && (!data || data.length === 0)) {
    alert('No se guardó (posible bloqueo por RLS). Revisá las policies de landing_blocks.');
    return;
  }
  if (error) {
    console.error('[saveAdminBloque] error:', error);
    alert('Error: ' + (error.message || 'desconocido'));
    errEl.textContent = error.message || 'Error al guardar';
    errEl.style.display = 'block';
    return;
  }

  // Refresh cache and re-render dependent UIs
  await loadLandingBlocks();
  // If the user is currently on the Clases section, refresh its static content
  // so the change appears immediately without a page reload.
  if (window._loaded_clases && document.getElementById('clases-static-content')) {
    renderClasesStaticContent();
  }

  closeAdminModal();
  showToast(id ? 'Bloque actualizado ✓' : 'Bloque creado ✓');
  loadAdminBloques();
}

async function confirmDeleteAdminBloque(id) {
  if (!confirm('¿Eliminar este bloque? Esta acción no se puede deshacer.')) return;
  const { error } = await sb.from('landing_blocks').delete().eq('id', id);
  if (error) { showToast('Error al eliminar: ' + error.message, true); return; }
  await loadLandingBlocks();
  if (window._loaded_clases && document.getElementById('clases-static-content')) {
    renderClasesStaticContent();
  }
  showToast('Bloque eliminado');
  loadAdminBloques();
}

/* In-memory cache for app_settings rows (Supabase). Populated by loadAppSettings(). */
window._appSettingsCache = {};

async function loadAppSettings() {
  try {
    const { data, error } = await sb.from('app_settings').select('key,value');
    if (error) { console.warn('[app_settings] read error:', error.message); return; }
    for (const row of data || []) window._appSettingsCache[row.key] = row.value;
  } catch (e) {
    console.warn('[app_settings] load exception:', e);
  }
}

function getSetting(key, fallback) {
  return window._appSettingsCache?.[key] || fallback;
}

async function setSetting(key, value) {
  window._appSettingsCache[key] = value;
  const { error } = await sb.from('app_settings').upsert(
    { key, value, updated_at: new Date().toISOString() },
    { onConflict: 'key' }
  );
  if (error) throw error;
}

/* List images stored in the thumbnails bucket. We list known admin subfolders +
   bucket root so users see everything the app has uploaded. */
async function loadAdminImagenesGaleria() {
  const container = document.getElementById('img-mgr-galeria');
  if (!container) return;
  container.innerHTML = '<div class="card rounded-xl p-4 text-center text-xs text-white/40">Cargando galería…</div>';

  const prefixes = ['', 'admin/hero', 'admin/nutricion', 'admin/videos', 'admin/courses', 'lessons'];
  const items = [];
  for (const prefix of prefixes) {
    try {
      const { data, error } = await sb.storage.from('thumbnails').list(prefix, {
        limit: 500,
        sortBy: { column: 'created_at', order: 'desc' },
      });
      if (error) { console.warn('[galeria] list error', prefix, error.message); continue; }
      for (const f of data || []) {
        // Folders have id === null in Supabase Storage listing — skip them
        if (!f.id || !f.name) continue;
        const path = prefix ? `${prefix}/${f.name}` : f.name;
        items.push({ path, name: f.name, createdAt: f.created_at });
      }
    } catch (e) { console.warn('[galeria] exception', prefix, e); }
  }

  // Dedupe (root list can overlap when buckets are flat) and sort newest first
  const seen = new Set();
  const unique = items.filter(i => seen.has(i.path) ? false : (seen.add(i.path), true));
  unique.sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));

  if (!unique.length) {
    container.innerHTML = renderAdminEmptyState('🖼️', 'No hay imágenes en la galería aún', 'Subí imágenes desde los tabs Videos, Cursos o las cards de Hero/Nutrición arriba');
    return;
  }

  container.innerHTML = `
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
      ${unique.map(it => {
        const { data: pub } = sb.storage.from('thumbnails').getPublicUrl(it.path);
        const url = pub?.publicUrl || '';
        const safePath = escHtml(it.path);
        return `
        <div class="card rounded-xl overflow-hidden flex flex-col">
          <div class="w-full" style="aspect-ratio:1/1; background:rgba(255,255,255,.04)">
            <img src="${escHtml(url)}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;" loading="lazy" onerror="this.style.display='none'">
          </div>
          <div class="p-2">
            <p class="text-[10px] text-white/40 truncate mb-1.5" title="${safePath}">${escHtml(it.name)}</p>
            <div class="flex gap-1">
              <button onclick="_galeriaCopyUrl('${escHtml(url)}')"
                class="btn-ghost flex-1 text-[10px] px-1.5 py-1 rounded-md flex items-center justify-center gap-1">
                <i data-lucide="copy" class="w-3 h-3"></i>Copiar
              </button>
              <button onclick="_galeriaDelete('${safePath}')"
                class="text-[10px] px-1.5 py-1 rounded-md flex items-center justify-center gap-1 text-red-400/80"
                style="background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.15);">
                <i data-lucide="trash-2" class="w-3 h-3"></i>
              </button>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
  lucide.createIcons();
}

async function _galeriaCopyUrl(url) {
  try {
    await navigator.clipboard.writeText(url);
    showToast('✓ URL copiada');
  } catch {
    showToast('No se pudo copiar', true);
  }
}

async function _galeriaDelete(path) {
  if (!confirm(`¿Eliminar imagen?\n${path}`)) return;
  try {
    const { error } = await sb.storage.from('thumbnails').remove([path]);
    if (error) throw error;
    showToast('✓ Imagen eliminada');
    loadAdminImagenesGaleria();
  } catch (err) {
    console.error('[galeria] delete error:', err);
    showToast('Error al eliminar: ' + (err?.message || err), true);
  }
}

async function _saveYoutubeMainUrl() {
  const input  = document.getElementById('yt-main-url');
  const status = document.getElementById('yt-main-status');
  const url    = (input?.value || '').trim();
  if (!url) { showToast('Pega una URL de YouTube', true); return; }
  const id = getYoutubeId(url);
  if (!id) { showToast('URL de YouTube inválida', true); return; }
  try {
    await setSetting('youtube_main_url', url);
    applyStoredImagesToDom();
    // Update the in-card preview too
    const preview = document.getElementById('yt-main-preview');
    if (preview) preview.src = `https://www.youtube.com/embed/${id}`;
    if (status) { status.textContent = '✓ Guardado'; status.classList.remove('hidden'); }
    showToast('✓ Video actualizado');
  } catch (err) {
    console.error('[yt-main] save error:', err);
    showToast('Error al guardar: ' + (err?.message || err), true);
  }
}

function _pickImageForSlot(slot) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async () => {
    const file = input.files?.[0];
    if (!file) return;
    await _uploadSlotImage(slot, file);
  };
  input.click();
}

function _pickThumbForDbRow(table, id) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async () => {
    const file = input.files?.[0];
    if (!file) return;
    await _uploadDbThumb(table, id, file);
  };
  input.click();
}

async function _uploadSlotImage(slot, file) {
  const previewEl = document.getElementById('img-mgr-preview-' + slot);
  const progEl    = document.getElementById('img-mgr-progress-' + slot);
  const bar       = progEl?.querySelector('.img-mgr-bar');
  const labelEl   = progEl?.querySelector('.img-mgr-label');

  // Live preview before upload completes
  const localUrl = URL.createObjectURL(file);
  if (previewEl) previewEl.innerHTML = `<img src="${localUrl}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">`;

  if (progEl) progEl.classList.remove('hidden');
  if (bar) bar.style.width = '0%';
  if (labelEl) labelEl.textContent = 'Subiendo…';

  try {
    const publicUrl = await _uploadImageToBucket('admin/' + slot, file, pct => {
      if (bar) bar.style.width = pct + '%';
      if (labelEl) labelEl.textContent = `Subiendo… ${pct}%`;
    });

    const storageKey = slot === 'hero' ? 'hero_image_url' : 'nutricion_image_url';
    await setSetting(storageKey, publicUrl);
    applyStoredImagesToDom();

    if (previewEl) previewEl.innerHTML = `<img src="${publicUrl}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">`;
    if (labelEl) labelEl.textContent = '✓ Imagen actualizada';
    if (bar) bar.style.width = '100%';
    showToast('✓ Imagen actualizada');
    setTimeout(() => progEl?.classList.add('hidden'), 1500);
  } catch (err) {
    console.error('[img-mgr] upload error:', err);
    if (labelEl) labelEl.textContent = 'Error: ' + (err?.message || err);
    showToast('Error al subir imagen', true);
  }
}

async function _uploadDbThumb(table, id, file) {
  const statusEl = document.getElementById(`img-mgr-status-${table}-${id}`);
  if (statusEl) statusEl.textContent = 'Subiendo…';
  try {
    const publicUrl = await _uploadImageToBucket('admin/' + table, file, pct => {
      if (statusEl) statusEl.textContent = `Subiendo… ${pct}%`;
    });
    const { error } = await sb.from(table).update({ thumbnail_url: publicUrl }).eq('id', id);
    if (error) throw error;
    if (statusEl) statusEl.textContent = '✓ Imagen actualizada';
    showToast('✓ Imagen actualizada');
    // Refresh list so the preview thumbnail updates
    loadAdminImagenes();
  } catch (err) {
    console.error('[img-mgr] db thumb upload error:', err);
    if (statusEl) statusEl.textContent = 'Error: ' + (err?.message || err);
    showToast('Error al subir imagen', true);
  }
}

function _uploadImageToBucket(pathPrefix, file, onProgress) {
  return new Promise(async (resolve, reject) => {
    try {
      const safeName = file.name.replace(/[^\w.\-]+/g, '_');
      const path     = `${pathPrefix}/${Date.now()}-${safeName}`;
      const { data: { session } } = await sb.auth.getSession();
      const token = session?.access_token || SUPABASE_KEY;
      const url   = `${SUPABASE_URL}/storage/v1/object/thumbnails/${encodeURI(path)}`;
      const xhr   = new XMLHttpRequest();
      xhr.timeout = 90_000;
      xhr.upload.onprogress = e => {
        if (e.lengthComputable && onProgress) onProgress(Math.round(e.loaded / e.total * 100));
      };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          const { data: pub } = sb.storage.from('thumbnails').getPublicUrl(path);
          resolve(pub?.publicUrl || `${SUPABASE_URL}/storage/v1/object/public/thumbnails/${encodeURI(path)}`);
        } else {
          reject(new Error(`HTTP ${xhr.status}: ${xhr.responseText}`));
        }
      };
      xhr.onerror   = () => reject(new Error('Network error (CORS o conexión)'));
      xhr.ontimeout = () => reject(new Error('Timeout 90s'));
      xhr.open('POST', url);
      xhr.setRequestHeader('Authorization', `Bearer ${token}`);
      xhr.setRequestHeader('apikey', SUPABASE_KEY);
      xhr.setRequestHeader('x-upsert', 'true');
      xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
      xhr.send(file);
    } catch (e) { reject(e); }
  });
}

function getYoutubeId(url) {
  if (!url) return null;
  const match = String(url).match(/(?:v=|youtu\.be\/|embed\/)([^&\s?]+)/);
  return match ? match[1] : null;
}

/* Apply stored hero/nutrición URLs to the live DOM. Called at boot and after upload. */
function applyStoredImagesToDom() {
  const heroUrl      = getSetting('hero_image_url',      null);
  const nutricionUrl = getSetting('nutricion_image_url', null);
  const youtubeUrl   = getSetting('youtube_main_url',    null);
  if (heroUrl) {
    const el = document.getElementById('hero-inicio-img');
    if (el) el.src = heroUrl;
  }
  if (nutricionUrl) {
    const el = document.getElementById('nutricion-img');
    if (el) el.src = nutricionUrl;
  }
  if (youtubeUrl) {
    const id = getYoutubeId(youtubeUrl);
    const iframe = document.getElementById('clases-youtube-iframe');
    if (id && iframe) iframe.src = `https://www.youtube.com/embed/${id}`;
  }
}
